name: Validation
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    name: Backend
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: false
      - name: Private synthetic fixture directory
        run: |
          test_tmp=$(mktemp -d "$RUNNER_TEMP/chartrove-tests.XXXXXX")
          printf 'TMPDIR=%s\n' "$test_tmp" >> "$GITHUB_ENV"
      - name: Synthetic container build-context privacy
        run: sh scripts/test-container-context.sh
      - run: make prepare-backend
      - run: go mod verify
      - run: go vet ./...
      - run: go test -p 1 ./backend/... -count=1
      - run: go build -o "$RUNNER_TEMP/fasten" ./backend/cmd/fasten
      - run: go build -o "$RUNNER_TEMP/fasten-backup" ./backend/cmd/fasten-backup
      - name: Verify CGO-free PostgreSQL-only build compatibility
        env:
          CGO_ENABLED: '0'
        run: |
          go test ./backend/pkg/database ./backend/cmd/fasten-backup -run '^TestEncryptedSQLiteBackupWithoutCGO$' -count=1
          go build -o "$RUNNER_TEMP/fasten-postgres-only" ./backend/cmd/fasten
  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NG_CLI_ANALYTICS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.0'
          package-manager-cache: false
      - run: make dep-frontend
      - run: node --test frontend/desktop-tests/*.test.mjs
      - working-directory: frontend
        run: node node_modules/@angular/cli/bin/ng.js test --watch=false --progress=false --browsers=ChromeHeadlessCI --reporters=dots
      - working-directory: frontend
        run: node node_modules/@angular/cli/bin/ng.js build --configuration desktop_prod --output-path="$RUNNER_TEMP/frontend"
  desktop:
    name: Desktop
    runs-on: macos-15
    timeout-minutes: 30
    env:
      NG_CLI_ANALYTICS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.0'
          package-manager-cache: false
      - name: Private synthetic fixture directory
        run: |
          test_tmp=$(mktemp -d "$RUNNER_TEMP/chartrove-tests.XXXXXX")
          printf 'TMPDIR=%s\n' "$test_tmp" >> "$GITHUB_ENV"
      - run: make prepare-backend
      - working-directory: desktop
        run: go mod verify
      - working-directory: desktop
        run: go vet ./...
      - working-directory: desktop
        run: go test ./... -count=1
      - working-directory: desktop
        run: go test github.com/fastenhealth/fasten-onprem/backend/pkg/web -run TestEmbedded -count=1 -timeout=120s
      - working-directory: desktop
        run: go build -o "$RUNNER_TEMP/chartrove" ./cmd/fasten-desktop
      - name: Package the native Apple Silicon app without publication
        run: |
          make dep-frontend
          sh desktop/build.sh
          package_root=$(mktemp -d "$RUNNER_TEMP/chartrove-package.XXXXXX")
          trap 'rm -rf "$package_root"' EXIT
          ditto -x -k dist/Chartrove.zip "$package_root"
          binary="$package_root/Chartrove.app/Contents/MacOS/chartrove"
          test "$(lipo -archs "$binary")" = arm64
          codesign --verify --strict "$package_root/Chartrove.app"
          cmp LICENSE.md "$package_root/Chartrove.app/Contents/Resources/LICENSE.md"
          "$binary" --help
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            os: macos-15
            build-mode: manual
          - language: javascript-typescript
            os: ubuntu-24.04
            build-mode: none
          - language: actions
            os: ubuntu-24.04
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: matrix.language == 'go'
        with:
          go-version: '1.27.3'
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: matrix.language == 'javascript-typescript'
        with:
          node-version: '26.13.0'
          package-manager-cache: false
      - name: Prepare Go metadata
        if: matrix.language == 'go'
        run: make prepare-backend
      - name: Install locked frontend dependencies
        if: matrix.language == 'javascript-typescript'
        run: make dep-frontend
      - name: Initialize CodeQL
        uses: github/codeql-action/init@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          dependency-caching: false
      - name: Trace backend build
        if: matrix.language == 'go'
        run: go build -a -o "$RUNNER_TEMP/codeql-backend" ./backend/cmd/fasten
      - name: Trace backup command
        if: matrix.language == 'go'
        run: go build -o "$RUNNER_TEMP/codeql-backup" ./backend/cmd/fasten-backup
      - name: Trace desktop build
        if: matrix.language == 'go'
        working-directory: desktop
        run: go build -a -o "$RUNNER_TEMP/codeql-desktop" ./cmd/fasten-desktop
      - name: Analyze checked-in code
        uses: github/codeql-action/analyze@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          category: '/language:${{ matrix.language }}'
          output: ${{ runner.temp }}/codeql-results
          upload-database: false
          wait-for-processing: true
