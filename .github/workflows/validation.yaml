name: Validation
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      export_desktop:
        description: Export a native inspection package after separate owner authorization
        type: boolean
        required: false
        default: false
      artifact_source_sha:
        description: Exact accepted main SHA for the optional export
        type: string
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    name: Backend
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: false
      - name: Private synthetic fixture directory
        run: |
          test_tmp=$(mktemp -d "$RUNNER_TEMP/chartrove-tests.XXXXXX")
          printf 'TMPDIR=%s\n' "$test_tmp" >> "$GITHUB_ENV"
      - name: Synthetic container build-context privacy
        run: sh scripts/test-container-context.sh
      - run: make prepare-backend
      - run: go mod verify
      - run: go vet ./...
      - run: go test -p 1 ./backend/... -count=1
      - run: go build -o "$RUNNER_TEMP/fasten" ./backend/cmd/fasten
      - run: go build -o "$RUNNER_TEMP/fasten-backup" ./backend/cmd/fasten-backup
      - name: Verify CGO-free PostgreSQL-only build compatibility
        env:
          CGO_ENABLED: '0'
        run: |
          go test ./backend/pkg/database ./backend/cmd/fasten-backup -run '^TestEncryptedSQLiteBackupWithoutCGO$' -count=1
          go build -o "$RUNNER_TEMP/fasten-postgres-only" ./backend/cmd/fasten
  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NG_CLI_ANALYTICS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.0'
          package-manager-cache: false
      - run: make dep-frontend
      - run: node --test frontend/desktop-tests/*.test.mjs
      - working-directory: frontend
        run: node node_modules/@angular/cli/bin/ng.js test --watch=false --progress=false --browsers=ChromeHeadlessCI --reporters=dots
      - working-directory: frontend
        run: node node_modules/@angular/cli/bin/ng.js build --configuration desktop_prod --output-path="$RUNNER_TEMP/frontend"
  desktop:
    name: Desktop
    runs-on: macos-15
    timeout-minutes: 30
    env:
      NG_CLI_ANALYTICS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Bind the optional artifact request before building
        if: ${{ inputs.export_desktop == true }}
        env:
          CHARTROVE_ARTIFACT_SOURCE_SHA: ${{ inputs.artifact_source_sha }}
        run: sh scripts/validate-desktop-artifact-request.sh
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.0'
          package-manager-cache: false
      - name: Private synthetic fixture directory
        run: |
          test_tmp=$(mktemp -d "$RUNNER_TEMP/chartrove-tests.XXXXXX")
          printf 'TMPDIR=%s\n' "$test_tmp" >> "$GITHUB_ENV"
      - run: make prepare-backend
      - working-directory: desktop
        run: go mod verify
      - working-directory: desktop
        run: go vet ./...
      - working-directory: desktop
        run: go test ./... -count=1
      - working-directory: desktop
        run: go test github.com/fastenhealth/fasten-onprem/backend/pkg/web -run TestEmbedded -count=1 -timeout=120s
      - working-directory: desktop
        run: go build -o "$RUNNER_TEMP/chartrove" ./cmd/fasten-desktop
      - name: Package the native Apple Silicon app without publication
        run: |
          make dep-frontend
          sh desktop/build.sh
          package_root=$(mktemp -d "$RUNNER_TEMP/chartrove-package.XXXXXX")
          trap 'rm -rf "$package_root"' EXIT
          ditto -x -k dist/Chartrove.zip "$package_root"
          binary="$package_root/Chartrove.app/Contents/MacOS/chartrove"
          test "$(lipo -archs "$binary")" = arm64
          codesign --verify --strict "$package_root/Chartrove.app"
          cmp LICENSE.md "$package_root/Chartrove.app/Contents/Resources/LICENSE.md"
          "$binary" --data-dir "$package_root/help-data" --help
          test ! -e "$package_root/help-data"
          backup="$package_root/Chartrove.app/Contents/MacOS/fasten-backup"
          test -x "$backup" || { echo 'Extracted native package lacks the independent backup utility.' >&2; exit 1; }
          test "$(lipo -archs "$backup")" = arm64
          codesign --verify --strict "$backup"
          "$backup" --help
          set -o pipefail
          (
            cd desktop
            CHARTROVE_PACKAGED_BACKUP="$backup" go test -tags=packaged_backup_integration github.com/fastenhealth/fasten-onprem/backend/cmd/fasten-backup -run '^TestPackagedBackupBinaryRestoresSyntheticWAL$' -count=1 -timeout=60s -json
          ) | tee "$package_root/backup-test.json"
          python3 - "$package_root/backup-test.json" <<'PY'
          import json, sys
          events = [json.loads(line) for line in open(sys.argv[1])]
          selected = "TestPackagedBackupBinaryRestoresSyntheticWAL"
          assert any(e.get("Test") == selected and e.get("Action") == "pass" for e in events), "packaged backup test did not pass"
          assert not any(e.get("Action") in ("fail", "skip") for e in events), "packaged backup qualification failed or skipped"
          PY
      - name: Record the qualified native inspection package
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -s dist/Chartrove.zip
          test ! -L dist/Chartrove.zip
          archive_sha=$(shasum -a 256 dist/Chartrove.zip | awk '{print $1}')
          archive_bytes=$(wc -c < dist/Chartrove.zip | tr -d '[:space:]')
          (cd dist && shasum -a 256 Chartrove.zip > Chartrove.zip.sha256)
          jq -n --arg source "$GITHUB_SHA" --arg sha "$archive_sha" \
            --argjson bytes "$archive_bytes" --arg run_id "$GITHUB_RUN_ID" \
            --arg attempt "$GITHUB_RUN_ATTEMPT" \
            --arg run_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{source_sha:$source,target:"darwin/arm64",signing:"ad-hoc",
              archive:{name:"Chartrove.zip",sha256:$sha,bytes:$bytes},
              workflow:{run_id:$run_id,attempt:$attempt,url:$run_url},
              qualification:"Native packaging and synthetic backup checks passed; inspect full workflow outcome and operational acceptance separately"}' \
            > dist/Chartrove.build.json
          printf 'Qualified native source %s archive SHA256 %s bytes %s\n' "$GITHUB_SHA" "$archive_sha" "$archive_bytes"
      - name: Export the requested native inspection package
        if: >-
          ${{ github.event_name == 'workflow_dispatch' &&
              github.ref == 'refs/heads/main' && github.run_attempt == 1 &&
              inputs.export_desktop == true && inputs.artifact_source_sha == github.sha }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chartrove-macos-arm64-${{ github.sha }}-${{ github.run_id }}
          path: |
            dist/Chartrove.zip
            dist/Chartrove.zip.sha256
            dist/Chartrove.build.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          overwrite: false
          include-hidden-files: false
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            os: macos-15
            build-mode: manual
          - language: javascript-typescript
            os: ubuntu-24.04
            build-mode: none
          - language: actions
            os: ubuntu-24.04
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: matrix.language == 'go'
        with:
          go-version: '1.27.3'
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: matrix.language == 'javascript-typescript'
        with:
          node-version: '26.13.0'
          package-manager-cache: false
      - name: Prepare Go metadata
        if: matrix.language == 'go'
        run: make prepare-backend
      - name: Install locked frontend dependencies
        if: matrix.language == 'javascript-typescript'
        run: make dep-frontend
      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          dependency-caching: false
      - name: Trace backend build
        if: matrix.language == 'go'
        run: go build -a -o "$RUNNER_TEMP/codeql-backend" ./backend/cmd/fasten
      - name: Trace backup command
        if: matrix.language == 'go'
        run: go build -o "$RUNNER_TEMP/codeql-backup" ./backend/cmd/fasten-backup
      - name: Trace desktop build
        if: matrix.language == 'go'
        working-directory: desktop
        run: go build -a -o "$RUNNER_TEMP/codeql-desktop" ./cmd/fasten-desktop
      - name: Analyze checked-in code
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: '/language:${{ matrix.language }}'
          output: ${{ runner.temp }}/codeql-results
          upload-database: false
          wait-for-processing: true
