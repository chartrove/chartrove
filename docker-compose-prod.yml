services:
  fasten-prod:
    image: ghcr.io/fastenhealth/fasten-onprem:main
    hostname: ${HOSTNAME:-fasten}
    environment:
      - HOST_IP=${IP}
      - HOST_PORT=${PORT}
    ports:
      # Explicit FASTEN_BIND_HOST is required to publish beyond this host's loopback.
      - "${FASTEN_BIND_HOST:-127.0.0.1}:${PORT:-9090}:8080"
    volumes:
      - ./db:/opt/fasten/db
      - ./cache:/opt/fasten/cache
      - ./certs:/opt/fasten/certs/shared
