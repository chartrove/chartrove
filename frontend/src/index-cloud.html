<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, shrink-to-fit=no"
  />
  <link rel="icon" type="image/svg+xml" href="./assets/branding/chartrove.svg">
  <link rel="apple-touch-icon" href="./assets/favicon/apple-touch-icon.png">
  <link rel="manifest" href="./assets/favicon/site.webmanifest">
  <meta name="msapplication-TileColor" content="#ffffff">
  <meta name="theme-color" content="#ffffff">

  <title>Chartrove</title>
  <!--     Fonts and icons     -->
  <link href="https://cdn.hello.coop/css/hello-btn.css" rel="stylesheet"/>
  <script src="https://cdn.hello.coop/js/hello-btn.js"></script>

  <script>
    var baseHref = "/"

    // if the pathname includes /web, everthing before `/web` (and including web) should be set as the base path.
    if(window.location.pathname.includes('/web')){
      baseHref = "/web/"
      // probably running locally, and *may* include a subpath
      var subPath = window.location.pathname.split('/web').slice(0, 1)[0]
      if(subPath != "/"){
        //subpath, so we need to update the absolutePath with the subpath before adding the relative path to the end
        baseHref = subPath + '/web/'
      }
    }

    document.write(`<base href="${baseHref}"/>`);  </script>
  <style>
    app-root > .chartrove-startup {
      position: fixed;
      inset: 0;
      overflow: auto;
      box-sizing: border-box;
      display: grid;
      align-content: safe center;
      justify-content: center;
      justify-items: center;
      gap: 1rem;
      padding: 2rem;
      background: #fff;
      color: #24213b;
      font: 1rem/1.5 system-ui, sans-serif;
      text-align: center;
    }
    .chartrove-startup p { margin: 0; }
  </style>
  <noscript><style>.chartrove-startup [role="status"] { display: none; }</style></noscript>
</head>
<body>
  <app-root>
    <div class="chartrove-startup">
      <img src="./assets/branding/chartrove-logo.svg" width="205" height="50" alt="">
      <p role="status" aria-live="polite">Loading Chartrove…</p>
      <noscript>
        <p>Enable JavaScript to open Chartrove.</p>
      </noscript>
    </div>
  </app-root>
</body>
</html>
