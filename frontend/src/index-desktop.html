<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, shrink-to-fit=no"
  />
  <link rel="icon" type="image/svg+xml" href="./assets/branding/chartrove.svg">
  <link rel="manifest" href="./assets/favicon/site.webmanifest">
  <meta name="msapplication-TileColor" content="#603cba">
  <meta name="theme-color" content="#ffffff">

  <title>Chartrove</title>
  <!--     Fonts and icons     -->
  <link href="./assets/lforms/styles.css" rel="stylesheet">
  <script src="./assets/js/asmcrypto-2.3.2.all.es5.min.js"></script>
  <script>
    var baseHref = "/"

    // if the pathname includes /web, everthing before `/web` (and including web) should be set as the base path.
    if(window.location.pathname.includes('/web')){
      baseHref = "/web/"
      // probably running locally, and *may* include a subpath
      var subPath = window.location.pathname.split('/web').slice(0, 1)[0]
      if(subPath != "/"){
        //subpath, so we need to update the absolutePath with the subpath before adding the relative path to the end
        baseHref = subPath + '/web/'
      }
    }

    document.write(`<base href="${baseHref}"/>`);  </script>

  <!-- required for lhncbc/lforms -->
  <script src="./assets/js/webcomponents/webcomponents-loader.js"></script>

  <!-- wails -- this file is required in Desktop -->
  <script type="module">
    import * as runtime from '/wails/runtime.js';
    import { createDesktopBridge } from './assets/desktop/bridge.mjs';
    window.fastenDesktop = createDesktopBridge(runtime);
    window.dispatchEvent(new Event('fasten:desktop-ready'));
  </script>

  <script>
    if (!window.customElements) {
      document.write('<!--');
    }
  </script>
  <!-- ! DO NOT REMOVE THIS COMMENT, WE NEED ITS CLOSING MARKER -->
  <style>
    app-root > .chartrove-startup {
      position: fixed;
      inset: 0;
      overflow: auto;
      box-sizing: border-box;
      display: grid;
      align-content: safe center;
      justify-content: center;
      justify-items: center;
      gap: 1rem;
      padding: 2rem;
      background: #fff;
      color: #24213b;
      font: 1rem/1.5 system-ui, sans-serif;
      text-align: center;
    }
    .chartrove-startup p { margin: 0; }
  </style>
  <noscript><style>.chartrove-startup [role="status"] { display: none; }</style></noscript>
</head>
<body>
  <app-root>
    <div class="chartrove-startup">
      <img src="./assets/branding/chartrove.svg" width="64" height="64" alt="">
      <p role="status" aria-live="polite">Loading Chartrove…</p>
      <noscript>
        <p>Enable JavaScript to open Chartrove.</p>
      </noscript>
    </div>
  </app-root>
  <script src="./assets/js/lforms/assets/lib/zone.min.js"></script>
  <script src="./assets/js/lforms/lhc-forms.js"></script>
  <script src="./assets/js/lforms/fhir/lformsFHIRAll.min.js"></script>
</body>
</html>
