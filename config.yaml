######################################################################
# Version
#
# version specifies the version of this configuration file schema, not
# the fasten binary. There is only 1 version available at the moment
version: 1

web:
  listen:
    port: 8080
    host: 0.0.0.0
    # if you're using a reverse proxy like apache/nginx, you can override this value to serve fasten on a subpath.
    # eg. http://example.com/fasten/* vs http://example.com:8080
    # basepath: `/fasten`
    # leave empty unless behind a path prefixed proxy
    basepath: ''
    
    https:
      enabled: true
      certDir: "certs"
      sharedDir: "certs/shared"
  src:
    # the location on the filesystem where webapp javascript + css is located
    frontend:
      path: /opt/fasten/web
database:
  encryption:
    enabled: true
  #    key: ''
  type: 'sqlite' # PostgreSQL is validated with disposable fixtures; see CONTRIBUTING.md.
  location: '/opt/fasten/db/fasten.db' # PostgreSQL requires an explicit private DSN; existing production databases are not validation fixtures.
log:
  file: '' # absolute or relative paths allowed, eg. web.log
  level: INFO
# OIDC is opt-in. Configure a confidential web client, exact HTTPS issuer and
# exact frontend callback URL. Keep client_secret in the deployment secret store
# (FASTEN_AUTH_OIDC_CLIENT_SECRET), not in a committed file. No account auto-link.
auth:
  registration:
    # Disable subsequent public signups with FASTEN_AUTH_REGISTRATION_ENABLED=false.
    # Initial empty-database administrator setup and existing local login remain available.
    enabled: true
  oidc:
    enabled: false
    issuer: ""
    client_id: ""
    redirect_uri: "" # https://chartrove.example/web/auth/oidc/callback

jwt:
  session:
    # Absolute lifetime for newly issued sign-in/sign-up tokens; default 1h.
    # FASTEN_JWT_SESSION_DURATION overrides this value. Use units, e.g. 5m or 2h;
    # durations below 1s and invalid values are rejected before storage setup.
    duration: 1h
  issuer:
    # Required for standalone startup: supply a private per-installation value.
    # FASTEN_JWT_ISSUER_KEY overrides this example; retain existing private keys.
    # Empty values and the historical shared example are rejected before storage access.
    # The desktop manages its own persistent signing key. See docs/LOCAL_DATA_SAFETY.md.
    key: ""
